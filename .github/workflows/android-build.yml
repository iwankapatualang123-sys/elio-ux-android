name: Build Android APK

on:
  push:
    branches: [ main, speedometer-only ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare environment file
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Install Android command line tools
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare fixed signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/elioux-signing.p12"
            echo "ELIO_KEYSTORE_PATH=$RUNNER_TEMP/elioux-signing.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret SIGNING_KEYSTORE_BASE64 belum diisi - APK memakai kunci debug acak (update harus uninstall dulu)."
          fi

      - name: Build debug APK
        env:
          ELIO_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon

      # Tiap cabang punya rilis & nama file sendiri supaya tidak saling menimpa.
      - name: Choose release target
        run: |
          if [ "$GITHUB_REF_NAME" = "speedometer-only" ]; then
            echo "APK_NAME=ElioSpeedo.apk" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=speedo-build" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=Elio Speedo - Build Terbaru (khusus speedometer)" >> "$GITHUB_ENV"
          else
            echo "APK_NAME=ElioUX-debug.apk" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=latest-build" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=Elio UX - Build Terbaru" >> "$GITHUB_ENV"
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish/Update stable release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            APK hasil build otomatis dari commit terbaru di cabang `${{ github.ref_name }}`.
            Unduh `${{ env.APK_NAME }}` di bawah, lalu pasang di Tablet / HP Android Samsung Galaxy Tab A (izinkan "Install dari sumber tidak dikenal" saat diminta).
          prerelease: true
          files: ${{ env.APK_NAME }}
