name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.5

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ElioUX-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElioUX-debug-apk
          path: ElioUX-debug.apk

      - name: Publish/Update stable release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Elio UX - Build Terbaru
          body: |
            APK hasil build otomatis dari commit terbaru di cabang `main`.
            Unduh `ElioUX-debug.apk` di bawah, lalu pasang di HP Android (izinkan "Install dari sumber tidak dikenal" saat diminta).
          prerelease: true
          files: ElioUX-debug.apk
